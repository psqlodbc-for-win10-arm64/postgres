# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "Branch_REL_*" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

  RELEASE_VERSION: "17.1-SNAPSHOT"

  APPLY_VCVARS: 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvarsarm64.bat'
  MSVCTargetBuildToolsBin: 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.44.35207/bin/HostARM64/arm64'

permissions:
  contents: write # allows the action to create a release. For more information, see [Permissions required for GitHub Apps](https://docs.github.com/en/rest/overview/permissions-required-for-github-apps?apiVersion=2022-11-28#repository-permissions-for-contents).

jobs:
  world:
    runs-on: windows-11-arm

    steps:
    - name: Deploy Win64Arm64XOpenSSL-3.5.4
      shell: pwsh
      run: |
        curl -OLs https://github.com/psqlodbc-for-win10-arm64/openssl/releases/download/Branch_openssl-3.5.4-81ebb734/Win64Arm64XOpenSSL-3_5_4-SNAPSHOT.zip
        unzip -q Win64Arm64XOpenSSL-3_5_4-SNAPSHOT.zip -d openssl

    - name: Make openssl.pc
      shell: pwsh
      run: |
        mkdir postgres-pkg-config
        pushd postgres-pkg-config

        # I saw `-IC:apostgrespostgres/openssl/include` by `"${env:GITHUB_WORKSPACE}/openssl/include"`.

        $libdir = "${env:GITHUB_WORKSPACE}/openssl/lib".Replace("\", "/")
        $includedir = "${env:GITHUB_WORKSPACE}/openssl/include".Replace("\", "/")

        $pcFileContent = @"
        Name: OpenSSL
        Description: Secure Sockets Layer and cryptography libraries and tools
        Version: 3.5.4
        Libs: -L${libdir} -lssl -lcrypto
        Cflags: -I${includedir}
        "@

        Set-Content -Path "openssl.pc" $pcFileContent

        type openssl.pc

        popd

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13' 

    - name: pip install meson ninja
      run: pip install meson ninja

    - uses: actions/checkout@v5
      with:
        path: postgres

    - name: Deploy win_flex_bison-2.5.25
      shell: pwsh
      run: |
        curl -OL https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip
        unzip win_flex_bison-2.5.25.zip -d win_flex_bison

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - uses: actions/checkout@v5.0.0
      name: Toolings checkout
      with:
        repository: psqlodbc-for-win10-arm64/Toolings
        path: Toolings

    - name: Toolings Restore dependencies
      working-directory: Toolings
      run: dotnet restore

    - name: Toolings Build
      working-directory: Toolings
      run: dotnet build --no-restore

    - uses: actions/checkout@v5.0.0
      name: PgBuilder checkout
      with:
        repository: psqlodbc-for-win10-arm64/PgBuilder
        path: PgBuilder

    - name: PgBuilder Restore dependencies
      working-directory: PgBuilder
      run: dotnet restore

    - name: PgBuilder Build
      working-directory: PgBuilder
      run: dotnet build --no-restore

    - name: Configure postgres to build Arm64X binaries
      working-directory: postgres
      shell: cmd
      run: |
        call "%APPLY_VCVARS%"

        set CL_EXE=%MSVCTargetBuildToolsBin%/cl.exe
        set LINK_EXE=%MSVCTargetBuildToolsBin%/link.exe
        set LIB_EXE=%MSVCTargetBuildToolsBin%/lib.exe

        PATH %PATH%;%GITHUB_WORKSPACE%/win_flex_bison
        PATH %PATH%;%GITHUB_WORKSPACE%/postgres-build/src/timezone

        dotnet run --project "%GITHUB_WORKSPACE%/PgBuilder/PgBuilder/PgBuilder.csproj" --no-build /p:Platform="AnyCPU"  -- postgresql-arm64x-prepare ^
         --meson meson.exe ^
         --prefix "%GITHUB_WORKSPACE%/postgres-inst" ^
         --build-dir "%GITHUB_WORKSPACE%/postgres-build" ^
         --pkg-config "%GITHUB_WORKSPACE%/Toolings/PkgConfigAlternative/bin/Debug/net8.0/pkg-config.exe" ^
         --pkg-config-dir "%GITHUB_WORKSPACE%/postgres-pkg-config" ^
         --alt-cc "%GITHUB_WORKSPACE%/Toolings/Arm64XDualObjCL/bin/Debug/net8.0-windows/Arm64XDualObjCL.exe" ^
         --alt-ld "%GITHUB_WORKSPACE%/Toolings/Arm64XDualObjLINK/bin/Debug/net8.0-windows/Arm64XDualObjLINK.exe" ^
         --alt-ar "%GITHUB_WORKSPACE%/Toolings/Arm64XDualObjLIB/bin/Debug/net8.0-windows/Arm64XDualObjLIB.exe" ^
         "%GITHUB_WORKSPACE%/postgres"

    - name: Build postgres Arm64X binaries
      working-directory: postgres
      shell: cmd
      run: |
        call "%APPLY_VCVARS%"

        set CL_EXE=%MSVCTargetBuildToolsBin%/cl.exe
        set LINK_EXE=%MSVCTargetBuildToolsBin%/link.exe
        set LIB_EXE=%MSVCTargetBuildToolsBin%/lib.exe

        PATH %PATH%;%GITHUB_WORKSPACE%/win_flex_bison
        PATH %PATH%;%GITHUB_WORKSPACE%/postgres-build/src/timezone

        ninja

    - name: Ensure binaries are Arm64X
      shell: pwsh
      run: |
        # function is written with the help of gpt-4o-mini:
        function Check-ExecutableType {
            param (
                [string]$ExePath,                  # The path to the executable file
                [string]$ExpectedFileType          # The expected file type (for example, "X64" or "ARM64")
            )

            # Check if the executable exists
            if (-Not (Test-Path $ExePath)) {
                throw "The executable at '$ExePath' does not exist."
            }

            # Execute the IsArm64x command and get the output
            $isArm64xPath = "${env:GITHUB_WORKSPACE}/Toolings/IsArm64x/bin/Debug/net8.0/IsArm64x.dll"
            $output = & dotnet $isArm64xPath $ExePath

            # Trim the output to remove trailing whitespace/newlines
            $actualFileType = $output.Trim()

            # Compare actual output with expected file type
            if ($actualFileType -ne $ExpectedFileType) {
                throw "Expected file type '$ExpectedFileType', but got '$actualFileType'."
            }

            # Return a success message if the types match
            return "The executable '$ExePath' is of type '$actualFileType', as expected."
        }

        Check-ExecutableType "${env:GITHUB_WORKSPACE}/postgres-inst/bin/postgres.exe" "Arm64X"
        Check-ExecutableType "${env:GITHUB_WORKSPACE}/postgres-inst/bin/libpq.dll"    "Arm64X"
        Check-ExecutableType "${env:GITHUB_WORKSPACE}/postgres-inst/lib/lo.dll"       "Arm64X"

    - name: Create gh-release dir
      shell: pwsh
      run: mkdir gh-release

    - name: Make a zip
      working-directory: postgres-inst
      shell: pwsh
      run: |
        7z.exe a -r "${env:GITHUB_WORKSPACE}/gh-release/postgresql-${env:RELEASE_VERSION}-windows-arm64x.zip" .

    - name: Make a GitHub Release
      uses: xresloader/upload-to-github-release@v1.6.1
      with:
        default_release_name: 'v${{ env.RELEASE_VERSION }} (Arm64X)'
        file: gh-release/*.zip
        draft: false
        prerelease: true
        verbose: true
